# Local/Coolify reference. In Coolify the domain (umfrage.stratpool.pro) and TLS are set in the UI;
# Traefik labels are generated by Coolify.
services:
  ki-umfrage:
    build: .
    restart: unless-stopped
    ports:
      - "3000"
    volumes:
      - ki-umfrage-data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=3000
      - DATA_DIR=/app/data

volumes:
  ki-umfrage-data:
